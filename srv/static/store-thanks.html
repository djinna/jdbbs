<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you — jdbb studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/static/favicon.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="/static/theme.css">
<style>
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--body)}
.wrap{max-width:var(--shell-max);margin:auto;padding:0 var(--shell-gutter) 64px}
.hero{padding:48px 0 24px;border-bottom:1px solid var(--border-strong)}
.kicker{font:700 11px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font:600 clamp(26px,4vw,38px)/1.15 var(--display,var(--body));margin:10px 0 0;letter-spacing:-.01em}
.card{max-width:60ch;margin-top:28px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 22px;margin:20px 0;font-size:15px}
.kv dt{font:700 11px/1.7 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.kv dd{margin:0}.kv dd a{word-break:break-all}
.btn{display:inline-block;border:1px solid var(--border-strong);background:var(--text);color:var(--bg);padding:10px 16px;text-decoration:none;font:600 14px var(--mono)}
.small{color:var(--text-secondary);font-size:13.5px}.mono{font-family:var(--mono);font-size:13px}
.wait{color:var(--text-muted);font-family:var(--mono);font-size:13px}.wait::after{content:'…';animation:d 1.2s steps(4) infinite}@keyframes d{to{content:''}}
.error{color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
<header class="jdbb-masthead"><a class="jdbb-wordmark" href="/"><span class="bracket">[</span><span class="kj">j</span>dbb<span class="bracket">]</span><span class="studio">studio</span></a><nav><a href="/factory">Factory Pass</a><a href="/">Home</a><div id="theme-bar"></div></nav></header>

<section class="hero">
  <div class="kicker">Factory Pass</div>
  <h1 id="h">Confirming your payment</h1>
</section>

<div class="card" id="card">
  <p class="wait" id="wait">Talking to Stripe</p>
</div>

<footer class="jdbb-footer"><a class="jdbb-wordmark" href="/"><span class="bracket">[</span><span class="kj">j</span>dbb<span class="bracket">]</span></a><nav aria-label="Footer"><a href="/factory">Factory Pass</a><a href="/">Home</a><a href="/field-notes">Field notes</a></nav><span class="copy">&copy; 2026 Jenna Dixon</span></footer>
</div>
<script src="/static/theme.js"></script>
<script>
JdbbTheme.mount(document.getElementById('theme-bar'));
(async()=>{
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const card=document.getElementById('card'), h=document.getElementById('h');
  const sid=new URLSearchParams(location.search).get('session_id');
  if(!sid){h.textContent='Nothing to confirm';card.innerHTML='<p>This page expects to be reached from the Stripe checkout. <a href="/factory">Back to the Factory Pass page</a>.</p>';return}
  const fmtUSD=c=>c%100?`$${(c/100).toFixed(2)}`:`$${c/100}`;
  const fmtDate=s=>{const d=new Date(s.replace(' ','T')+(/Z$|[+-]\d\d:\d\d$/.test(s)?'':'Z'));return isNaN(d)?s:d.toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})};
  let tries=0;
  while(true){
    let r,j;
    try{r=await fetch('/api/public/store/session?session_id='+encodeURIComponent(sid));j=await r.json()}catch(e){j={error:'Network hiccup.'}}
    if(r&&r.ok&&j.status==='paid'){
      if(j.kind==='addon'){
        h.textContent='Added to your pass';
        card.innerHTML=`<p>Thanks — your add-on is on the pass for <b>${esc(j.title)}</b>. A confirmation is on its way to <b>${esc(j.email)}</b>; Stripe sends the card receipt separately.</p>
        <dl class="kv"><dt>Builds remaining</dt><dd>${esc(j.credits_remaining)}</dd><dt>Pass live until</dt><dd>${esc(fmtDate(j.expires_at||''))}</dd><dt>Paid</dt><dd>${fmtUSD(j.amount)}</dd></dl>
        <p><a class="btn" href="${esc(j.portal_url)}">Back to your factory &rarr;</a></p>`;
      }else{
        h.textContent='Your Factory Pass is live';
        card.innerHTML=`<p>Thank you. We've set up a factory for <b>${esc(j.title)}</b> and emailed your sign-in details to <b>${esc(j.email)}</b>. The password is only in that email — if it hasn't arrived in a few minutes, check spam, then reply to any of our messages and we'll sort it out.</p>
        <dl class="kv"><dt>Your factory</dt><dd><a href="${esc(j.portal_url)}">${esc(j.portal_url)}</a></dd><dt>Builds included</dt><dd>${esc(j.credits_remaining)}</dd><dt>Pass live until</dt><dd>${esc(fmtDate(j.expires_at||''))}</dd><dt>Paid</dt><dd>${fmtUSD(j.amount)}${j.promo_code?` <span class="mono">(code ${esc(j.promo_code)})</span>`:''}</dd></dl>
        <p><a class="btn" href="${esc(j.portal_url)}">Open your factory &rarr;</a></p>
        <p class="small">First step inside: the transmittal — a short form about your book that generates your Word template. Stripe sends the card receipt separately. Full refund any time before your first build.</p>`;
      }
      return;
    }
    if(r&&r.ok&&j.status==='pending'&&tries<20){tries++;document.getElementById('wait').textContent='Waiting for Stripe to confirm the payment';await new Promise(res=>setTimeout(res,3000));continue}
    h.textContent=tries>=20?'Still waiting on Stripe':'Something went wrong';
    card.innerHTML=`<p class="error">${esc(j.error||'Stripe hasn\'t confirmed this payment yet.')}</p><p class="small">If your card was charged, you will still get your pass — our server checks with Stripe every minute and emails you when it lands. Reference: <span class="mono">${esc(sid)}</span></p>`;
    return;
  }
})();
</script>
</body>
</html>
