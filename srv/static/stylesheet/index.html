<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PI Editorial Stylesheet (working)</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>
(function(){ try {
  var FONTS={jetbrains:1,martian:1,plex:1,geist:1,literata:1,'ibm-serif':1,'source-serif':1,newsreader:1};
  var LEGACY={menlo:'jetbrains','ibm-sans':'geist'};
  var t = JSON.parse(localStorage.getItem('prodcal-theme-v1'));
  if (t) {
    if (t.dark) document.documentElement.classList.add('dark');
    var f = LEGACY[t.font] || t.font;
    if (f && FONTS[f]) document.documentElement.setAttribute('data-font', f);
  }
} catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Martian+Mono:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&family=Geist+Mono:wght@400;600&family=Geist:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Literata:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css?v=20260705a">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="wrap">
  <header class="jdbb-masthead">
    <a class="jdbb-wordmark" href="/"><span class="bracket">[</span><span class="kj">j</span>dbb<span class="bracket">]</span><span class="studio">studio</span></a>
    <nav>
      <a href="/stylesheet/authors">Authors’ view</a>
      <div id="theme-bar"></div>
    </nav>
  </header>
  <div class="jdbb-statusline">
    <span>Protocolized Anthology · Editorial Stylesheet</span>
    <span id="who">loading…</span>
  </div>

  <div class="page-head">
    <span class="kicker">Editorial</span>
    <h1 class="page-title">PI Editorial Stylesheet <span class="working-tag">working</span></h1>
  </div>

  <div class="toolbar">
    <div class="filters" data-group="status">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="proposed">Proposed</button>
      <button class="filter-btn" data-filter="accepted">Accepted</button>
      <button class="filter-btn" data-filter="rejected">Rejected</button>
      <button class="filter-btn" data-filter="author">Author-facing</button>
    </div>
    <div class="filters" data-group="scope">
      <button class="scope-filter-btn active" data-scope="all">All scopes</button>
      <button class="scope-filter-btn" data-scope="universal">Universal</button>
      <button class="scope-filter-btn" data-scope="zoothesia">Zoothesia</button>
    </div>
  </div>

  <hr class="rule-strong">

  <div class="exports">
    <span class="exports-label">Working</span>
    <a class="link-action" href="/stylesheet/export.html">.html</a>
    <a class="link-action" href="/stylesheet/export.md">.md</a>
    <span class="exports-label">Master (universal)</span>
    <a class="link-action" href="/stylesheet/export.html?scope=universal">.html</a>
    <a class="link-action" href="/stylesheet/export.md?scope=universal">.md</a>
    <span class="exports-label">Zoothesia only</span>
    <a class="link-action" href="/stylesheet/export.html?scope=zoothesia">.html</a>
    <a class="link-action" href="/stylesheet/export.md?scope=zoothesia">.md</a>
  </div>

  <main id="content"></main>
</div>

<div class="toast" id="toast"></div>
<script>window.SS_MODE = 'editor';</script>
<script src="/static/theme.js?v=20260705a"></script>
<script src="app.js?v=2"></script>
</body>
</html>
