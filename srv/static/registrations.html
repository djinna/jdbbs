<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registrations — Protocolize Your Book</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<script>
(function(){ try {
  var FONTS={jetbrains:1,martian:1,plex:1,geist:1,literata:1,'ibm-serif':1,'source-serif':1,newsreader:1};
  var LEGACY={menlo:'jetbrains','ibm-sans':'geist'};
  var t = JSON.parse(localStorage.getItem('prodcal-theme-v1'));
  if (t) { if (t.dark) document.documentElement.classList.add('dark');
    var f = LEGACY[t.font] || t.font; if (f && FONTS[f]) document.documentElement.setAttribute('data-font', f); }
} catch(e){} })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;500;600;700&family=Literata:wght@400;500;600;700&family=Source+Serif+4:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@400;500;600&family=Geist:wght@400;500;600&family=Martian+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ── Terminal Folio tokens (inlined subset of the studio's theme.css so this
      page renders identically whether opened as a file or served on-site).
      cardless ledger · hairline rules · zero radius/shadow/gradient. ── */
:root{
  --bg:#F7F9FA; --surface:#FFF; --border:#DCE3E8; --border-strong:#0E1116;
  --text:#0E1116; --text-secondary:#5D6B76; --text-muted:#8A97A1;
  --accent:#007699; --green:#2F7D4F; --red:#B3261E; --yellow:#8A6A00;
  --mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --body:"Inter",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-size-adjust:none;
}
html.dark{
  --bg:#0C0E12; --surface:#12151B; --border:#232833; --border-strong:#3A404D;
  --text:#E8E6E1; --text-secondary:#8B909A; --text-muted:#6A707B;
  --accent:#3BC3F2; --green:#6BBF73; --red:#E5484D; --yellow:#D5A021;
}
/* Site-font map — same tokens the studio's theme.css switches (this page is
   itself the "curated middle" example, so it carries the live selector). */
html[data-font="jetbrains"]{--mono:"JetBrains Mono","SFMono-Regular",Menlo,monospace; --body:"JetBrains Mono","SFMono-Regular",Menlo,monospace;}
html[data-font="martian"]{--mono:"Martian Mono","SFMono-Regular",Menlo,monospace; --body:"Martian Mono","SFMono-Regular",Menlo,monospace; --font-size-adjust:0.52;}
html[data-font="plex"]{--mono:"IBM Plex Sans",-apple-system,sans-serif; --body:"IBM Plex Sans",-apple-system,sans-serif;}
html[data-font="geist"]{--mono:"Geist",-apple-system,sans-serif; --body:"Geist",-apple-system,sans-serif;}
html[data-font="literata"]{--mono:"Literata",Georgia,serif; --body:"Literata",Georgia,serif;}
html[data-font="ibm-serif"]{--mono:"IBM Plex Serif",Georgia,serif; --body:"IBM Plex Serif",Georgia,serif;}
html[data-font="source-serif"]{--mono:"Source Serif 4",Georgia,serif; --body:"Source Serif 4",Georgia,serif;}
html[data-font="newsreader"]{--mono:"Newsreader",Georgia,serif; --body:"Newsreader",Georgia,serif;}
*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--bg); font-size-adjust:var(--font-size-adjust);}
body{
  font-family:var(--body); color:var(--text); background:var(--bg);
  line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
.wrap{max-width:920px; margin:0 auto; padding:0 1.5rem 4rem;}

/* masthead */
.jdbb-masthead{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  padding:18px 0 14px; border-bottom:1px solid var(--border); font-family:var(--mono);
  flex-wrap:wrap;
}
.jdbb-wordmark{font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.02em; color:var(--text); text-decoration:none; white-space:nowrap;}
.jdbb-wordmark .bracket{color:var(--accent);}
.jdbb-wordmark .kj{letter-spacing:-.08em;}
.jdbb-wordmark .studio{color:var(--text-muted); font-weight:400; margin-left:.4rem;}
.jdbb-masthead nav{display:flex; align-items:center; gap:1.4rem; font-size:12px;}
.jdbb-masthead nav a{color:var(--text-secondary); text-decoration:none; padding:6px 0; border-bottom:1px solid transparent;}
.jdbb-masthead nav a:hover{color:var(--text); border-bottom-color:var(--accent);}

/* statusline */
.jdbb-statusline{
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:4px 24px;
  padding:12px 0; font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  color:var(--text-muted); text-transform:uppercase;
}
.jdbb-statusline .ok{color:var(--green);}

*{margin:0;padding:0;box-sizing:border-box;}
html{background:var(--bg);}
body{font-family:var(--body); color:var(--text); background:var(--bg); line-height:1.5; font-size:14px; -webkit-font-smoothing:antialiased;}
.wrap{max-width:1200px; margin:0 auto; padding:0 1.5rem 4rem;}

.jdbb-masthead{display:flex; align-items:center; justify-content:space-between; gap:1rem; padding:18px 0 14px; border-bottom:1px solid var(--border); font-family:var(--mono); flex-wrap:wrap;}
.jdbb-wordmark{font-family:var(--mono); font-size:15px; font-weight:700; letter-spacing:.02em; color:var(--text); text-decoration:none;}
.jdbb-wordmark .bracket{color:var(--accent);}
.jdbb-wordmark .kj{letter-spacing:-.08em;}
.jdbb-wordmark .studio{color:var(--text-muted); font-weight:400; margin-left:.4rem;}
.jdbb-masthead nav{display:flex; align-items:center; gap:1.4rem; font-size:12px;}
.jdbb-masthead nav a{color:var(--text-secondary); text-decoration:none; padding:6px 0; border-bottom:1px solid transparent;}
.jdbb-masthead nav a:hover{color:var(--text); border-bottom-color:var(--accent);}

.head{display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:1rem; margin:2rem 0 1rem;}
.head .kicker{font-family:var(--mono); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); display:block; margin-bottom:.6rem;}
.head h1{font-family:var(--mono); font-weight:600; font-size:clamp(22px,4vw,30px); line-height:1.2;}
.head .actions{display:flex; gap:.7rem; align-items:center;}
.count{font-family:var(--mono); font-size:13px; color:var(--text-secondary);}
.count b{color:var(--text);} .count .over{color:var(--yellow);}
.btn{font-family:var(--mono); font-size:13px; font-weight:600; color:var(--text); background:var(--surface); border:1px solid var(--border-strong); border-radius:0; padding:.55rem 1rem; cursor:pointer; text-decoration:none;}
.btn:hover{border-color:var(--accent); color:var(--accent);}
.btn.primary{color:#fff; background:var(--accent); border-color:var(--accent);}

hr.rule-strong{border:none; border-top:1px solid var(--border-strong); margin:0 0 0;}

table.reg{width:100%; border-collapse:collapse; margin-top:1.2rem; font-size:13px;}
table.reg th, table.reg td{text-align:left; vertical-align:top; padding:.6rem .8rem .6rem 0; border-top:1px solid var(--border);}
table.reg thead th{border-top:none; border-bottom:1px solid var(--border-strong); font-family:var(--mono); font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--text-muted); font-weight:600; white-space:nowrap;}
table.reg tr.over td{background:color-mix(in srgb, var(--yellow) 8%, transparent);}
td.num{font-family:var(--mono); color:var(--text-muted); white-space:nowrap;}
td.name{font-weight:600; color:var(--text); white-space:nowrap;}
td.email a{font-family:var(--mono); font-size:12px; color:var(--accent); text-decoration:none;}
td.email a:hover{text-decoration:underline;}
td.tag{font-family:var(--mono); font-size:12px; color:var(--text-secondary); white-space:nowrap;}
td.material{color:var(--text-secondary); max-width:340px;}
td.flag{font-family:var(--mono); font-size:12px; text-align:center;}
.yes{color:var(--green); font-weight:600;} .no{color:var(--text-muted);}
td.date{font-family:var(--mono); font-size:12px; color:var(--text-muted); white-space:nowrap;}
.empty{margin-top:2rem; padding:2rem; border:1px dashed var(--border-strong); text-align:center; color:var(--text-muted); font-family:var(--mono); font-size:13px;}
.err{margin-top:1.5rem; color:var(--red); font-family:var(--mono); font-size:13px;}
.goals{color:var(--text-muted); font-style:italic; margin-top:.25rem; font-size:12px;}
.legend{margin-top:1.2rem; font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--text-muted); text-transform:uppercase;}
</style>
</head>
<body>
<div class="wrap">
  <header class="jdbb-masthead">
    <a class="jdbb-wordmark" href="/"><span class="bracket">[</span><span class="kj">j</span>dbb<span class="bracket">]</span><span class="studio">studio</span></a>
    <nav>
      <a href="/admin/">Production</a>
      <a href="/workshop">Public form &rarr;</a>
    </nav>
  </header>

  <div class="head">
    <div>
      <span class="kicker">Protocol Symposium 2026</span>
      <h1>Protocolize Your Book &mdash; registrations</h1>
    </div>
    <div class="actions">
      <span class="count" id="count">&hellip;</span>
      <a class="btn" href="/api/admin/registrations.csv">Export CSV</a>
    </div>
  </div>

  <hr class="rule-strong">

  <div id="body"></div>
</div>

<script>
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
function yn(b){ return b ? '<span class="yes">yes</span>' : '<span class="no">&mdash;</span>'; }

fetch('/api/admin/registrations', {headers:{'Accept':'application/json'}})
  .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
  .then(function(d){
    var rows = d.registrations || [];
    var cap = d.soft_cap || 8;
    var cEl = document.getElementById('count');
    if (d.count > cap) {
      cEl.innerHTML = '<b>'+d.count+'</b> requests &middot; <span class="over">'+(d.count-cap)+' over soft cap of '+cap+'</span>';
    } else {
      cEl.innerHTML = '<b>'+d.count+'</b> of '+cap+' seats requested';
    }
    var body = document.getElementById('body');
    if (!rows.length) { body.innerHTML = '<div class="empty">No registrations yet. The public form is at <a href="/workshop">/workshop</a>.</div>'; return; }

    var h = '<table class="reg"><thead><tr>'+
      '<th>#</th><th>Name</th><th>Email</th><th>Region</th><th>All&nbsp;4</th><th>Type</th>'+
      '<th>Material / goals</th><th>Background</th><th>New</th><th>Email&nbsp;OK</th><th>Received</th>'+
      '</tr></thead><tbody>';
    rows.forEach(function(e, i){
      var over = (i+1) > cap;
      h += '<tr'+(over?' class="over"':'')+'>'+
        '<td class="num">'+(i+1)+'</td>'+
        '<td class="name">'+esc(e.name)+'</td>'+
        '<td class="email"><a href="mailto:'+esc(e.email)+'">'+esc(e.email)+'</a></td>'+
        '<td class="tag">'+esc(e.region||'—')+'</td>'+
        '<td class="flag">'+yn(e.all_sessions)+'</td>'+
        '<td class="tag">'+esc(e.material_type||'—')+'</td>'+
        '<td class="material">'+esc(e.material)+ (e.goals ? '<div class="goals">'+esc(e.goals)+'</div>' : '') +'</td>'+
        '<td class="tag">'+esc(e.background||'—')+'</td>'+
        '<td class="flag">'+yn(e.new_to_protocol)+'</td>'+
        '<td class="flag">'+yn(e.consent_email)+'</td>'+
        '<td class="date">'+esc((e.created_at||'').replace('T',' ').slice(0,16))+'</td>'+
        '</tr>';
    });
    h += '</tbody></table>';
    h += '<div class="legend">Rows past seat '+cap+' are shaded &mdash; soft cap, not enforced. "New" = new to protocol studies (curation tiebreaker). Order: earliest first.</div>';
    body.innerHTML = h;
  })
  .catch(function(err){
    document.getElementById('body').innerHTML = '<div class="err">Could not load registrations: '+esc(err.message)+'. (Are you logged in via exe.dev?)</div>';
  });
</script>
</body>
</html>
