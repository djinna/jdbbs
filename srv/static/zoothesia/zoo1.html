<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>01 Aster&#x27;s Story: Presence Must Preserve</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<script>
(function() {
  try { var t = JSON.parse(localStorage.getItem('prodcal-theme-v1')); if (t && t.dark) document.documentElement.classList.add('dark'); } catch(e) {}
})();
</script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f8f9fa; --surface: #ffffff; --border: #e0e2e6;
  --text: #111827; --text-secondary: #6b7280; --text-muted: #9ca3af;
  --accent: #2563eb; --green: #16a34a; --red: #dc2626; --yellow: #ca8a04; --orange: #ea580c;
  --badge-green-bg: rgba(22,163,74,0.1); --badge-red-bg: rgba(220,38,38,0.1);
  --badge-yellow-bg: rgba(202,138,4,0.1);
  --badge-dim-bg: #f1f3f5; --progress-bg: #f1f3f5;
  --toggle-bg: #f8f9fa;
  --noise-opacity: 0.035; --grid-color: rgba(160,168,180,0.6);
  --gradient-wash: linear-gradient(to bottom, rgba(230,233,240,0.3) 0%, transparent 60%);
  --theme-bg: rgba(255,255,255,0.92);
  --radius: 6px;
}
html.dark {
  --bg: #0f1115; --surface: #1a1d24; --border: #2a2d35;
  --text: #e4e5e7; --text-secondary: #9ca0a8; --text-muted: #6b7074;
  --accent: #5b9aff; --green: #34d399; --red: #f87171; --yellow: #fbbf24; --orange: #fb923c;
  --badge-green-bg: rgba(52,211,153,0.12); --badge-red-bg: rgba(248,113,113,0.12);
  --badge-yellow-bg: rgba(251,191,36,0.12);
  --badge-dim-bg: #23262e; --progress-bg: #23262e;
  --toggle-bg: #23262e;
  --noise-opacity: 0.012; --grid-color: rgba(90,96,110,0.7);
  --gradient-wash: linear-gradient(to bottom, rgba(20,22,28,0.4) 0%, transparent 60%);
  --theme-bg: rgba(26,29,36,0.92);
}

body {
  background: var(--bg); font-family: 'IBM Plex Serif', Georgia, serif;
  color: var(--text); min-height: 100vh; position: relative;
  transition: background 0.3s, color 0.3s;
}
body, body * { font-weight: 400; }

body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  background-size: 180px; opacity: var(--noise-opacity);
}
body::after {
  content: ''; position: fixed; top: 0; left: 0; right: 0; height: 50vh; z-index: 0;
  pointer-events: none; background: var(--gradient-wash);
}
.grid-lines { position: fixed; inset: 0; z-index: 0; pointer-events: none; display: flex; justify-content: center; }
.grid-lines-inner { width: 1120px; max-width: 100vw; display: flex; justify-content: space-between; padding: 0; }
.grid-line { width: 1px; background: repeating-linear-gradient(to bottom, var(--grid-color) 0px, var(--grid-color) 4px, transparent 4px, transparent 10px); }

.content { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 2.5rem 2rem 6rem; }

/* theme bar */
.theme-bar { position: fixed; top: 1rem; right: 2rem; z-index: 200; display: flex; align-items: center; gap: 0.25rem; background: var(--theme-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 14px; padding: 0.2rem 0.3rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: background 0.3s, border-color 0.3s; }
.theme-bar .font-options { display: flex; gap: 0.15rem; overflow: hidden; max-width: 0; opacity: 0; transition: max-width 0.3s cubic-bezier(0.4,0,0.2,1), opacity 0.2s; }
.theme-bar.expanded .font-options { max-width: 400px; opacity: 1; }
.theme-bar .font-name { padding: 0.25rem 0.5rem; font-size: 0.65rem; color: var(--text-secondary); cursor: pointer; white-space: nowrap; transition: color 0.15s; border-radius: 10px; }
.theme-bar .font-name:hover { color: var(--text); }
.theme-bar.expanded .font-name { display: none; }
.theme-opt { padding: 0.25rem 0.5rem; border-radius: 10px; border: none; background: transparent; color: var(--text-secondary); font-size: 0.65rem; cursor: pointer; white-space: nowrap; transition: all 0.15s; font-family: inherit; }
.theme-opt:hover { color: var(--text); background: var(--progress-bg); }
.theme-opt.active { color: var(--accent); background: rgba(37,99,235,0.08); }
html.dark .theme-opt.active { background: rgba(91,154,255,0.12); }
.theme-sep { width: 1px; height: 13px; background: var(--border); margin: 0 0.1rem; flex-shrink: 0; align-self: center; }
.dark-btn { width: 20px; height: 20px; padding: 0; border-radius: 50%; border: none; background: transparent; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 10px; cursor: pointer; transition: all 0.15s; flex-shrink: 0; }
.dark-btn:hover { color: var(--text); background: var(--progress-bg); }

/* chapter eyebrow nav */
.chapnav { display: flex; align-items: center; gap: 0.3rem; flex-wrap: wrap; margin-bottom: 1rem; padding-bottom: 0.4rem; }
.chapnav a { font-size: 0.78rem; color: var(--text-secondary); text-decoration: none; padding: 0.25rem 0.55rem; border-radius: 9999px; border: 1px solid transparent; white-space: nowrap; transition: all 0.12s; }
.chapnav a:hover { color: var(--text); background: var(--progress-bg); }
.chapnav a.cur { color: var(--accent); border-color: var(--border); background: var(--surface); font-weight: 600; }
.chapnav a .cn { color: var(--text-muted); margin-right: 0.3rem; font-size: 0.72rem; }
.chapnav a.cur .cn { color: var(--accent); }
.prevnext { display: flex; gap: 0.4rem; align-items: center; flex-shrink: 0; }
.prevnext a { font-size: 0.8rem; color: var(--accent); text-decoration: none; padding: 0.3rem 0.6rem; border: 1px solid var(--border); border-radius: 4px; white-space: nowrap; }
.prevnext a:hover { background: var(--progress-bg); }
.prevnext .disabled { color: var(--text-muted); border-color: var(--border); opacity: 0.4; pointer-events: none; }

/* header */
.header { display: flex; justify-content: space-between; align-items: flex-start; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); margin-bottom: 1.5rem; gap: 1rem; }
.header h1 { font-size: 1.5rem; letter-spacing: -0.03em; color: var(--text); }
.header .sub { font-size: 0.85rem; color: var(--text-secondary); margin-top: 0.25rem; }
.header .crumb { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }

/* role banner (primary control) */
.role-banner { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: var(--radius); padding: 0.7rem 1rem; margin-bottom: 1rem; }
.role-banner-lbl { font-size: 0.85rem; color: var(--text-secondary); }
.sel-role { font-size: 0.95rem; font-weight: 600; padding: 0.4rem 0.8rem; }
.role-banner-hint { font-size: 0.78rem; color: var(--text-muted); margin-left: auto; }

/* progress + toolbar */
.toolbar { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 1.75rem; }
.toolbar .spacer { flex: 1; }
.progress-wide { flex: 1; min-width: 160px; max-width: 360px; height: 5px; background: var(--progress-bg); border-radius: 3px; overflow: hidden; }
.progress-wide > i { display: block; height: 100%; background: var(--green); width: 0%; transition: width 0.3s; }
.prog-label { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }
.sel { padding: 0.4rem 0.7rem; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); color: var(--text); font-size: 0.82rem; font-family: inherit; }
.sel:focus { outline: none; border-color: var(--accent); }

/* buttons (prodcal) */
.btn { padding: 0.45rem 1rem; border-radius: 4px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 0.85rem; cursor: pointer; transition: opacity 0.15s; font-family: inherit; }
.btn:hover { opacity: 0.9; }
.btn-secondary { background: transparent; color: var(--text); border-color: var(--border); }
.btn-secondary:hover { background: var(--progress-bg); }
.btn-sm { padding: 0.3rem 0.7rem; font-size: 0.78rem; border-radius: 4px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-sm:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }

/* sections */
details.section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); margin: 0 0 1rem; overflow: hidden; }
details.section > summary { list-style: none; cursor: pointer; padding: 0.9rem 1.25rem; display: flex; align-items: center; gap: 0.6rem; }
details.section > summary::-webkit-details-marker { display: none; }
.sec-caret { color: var(--text-muted); transition: transform 0.15s; font-size: 0.7rem; }
details[open] > summary .sec-caret { transform: rotate(90deg); }
.sec-title { font-size: 0.95rem; color: var(--text); }
.sec-count { font-size: 0.78rem; color: var(--text-muted); }
.badge { display: inline-flex; align-items: center; gap: 0.3rem; padding: 0.18rem 0.55rem; border-radius: 9999px; font-size: 0.68rem; }
.badge-green { background: var(--badge-green-bg); color: var(--green); }
.badge-red { background: var(--badge-red-bg); color: var(--red); }
.badge-yellow { background: var(--badge-yellow-bg); color: var(--yellow); }
.badge-dim { background: var(--badge-dim-bg); color: var(--text-secondary); }
.badge-accent { background: rgba(37,99,235,0.1); color: var(--accent); }
html.dark .badge-accent { background: rgba(91,154,255,0.15); }

.group-actions { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; padding: 0.6rem 1.25rem; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--surface) 86%, var(--bg) 14%); font-size: 0.76rem; }
.group-actions .lbl { color: var(--text-muted); }
.group-actions .role-name { color: var(--text-secondary); margin-left: 0.5rem; }

.items { padding: 0.75rem 1.25rem 1rem; }

/* compact change table */
table.changes { width: 100%; border-collapse: collapse; }
table.changes thead th { text-align: left; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 500; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
table.changes th.c-n { width: 2.6rem; }
table.changes th.c-why { width: 12rem; }
table.changes th.c-you { width: 8.5rem; }
table.changes th.c-st { width: 5.5rem; }
tbody.item { border-bottom: 1px solid var(--border); }
tbody.item.done { background: color-mix(in srgb, var(--green) 4%, transparent); }
tbody.item.conflict { background: color-mix(in srgb, var(--red) 5%, transparent); }
tbody.item td { padding: 0.55rem 0.75rem; vertical-align: top; font-size: 0.9rem; }
.row-main td { border-top: 1px solid var(--border); }
tbody.item:first-of-type .row-main td { border-top: none; }
.c-n { color: var(--text-muted); font-size: 0.78rem; white-space: nowrap; }
/* Query/collection tables: topic name can be long, so let the first column
   wrap and give the query text the remaining width. */
table.changes.is-query th.c-n, table.changes.is-query td.c-n { width: 12rem; white-space: normal; color: var(--text); font-weight: 500; }
table.changes.is-query th.c-why, table.changes.is-query td.c-why { width: 5rem; }
table.changes.is-query td.c-change { word-break: normal; overflow-wrap: anywhere; }
.c-change { line-height: 1.5; word-break: break-word; }
.c-change .d-arr { color: var(--text-muted); margin: 0 0.4rem; }
.c-change .q-text { color: var(--text); }
.c-st { white-space: nowrap; }
.st-wrap { display: flex; align-items: center; gap: 0.25rem; flex-wrap: wrap; }
.chip-other { width: 1.15rem; height: 1.15rem; padding: 0; justify-content: center; font-size: 0.62rem; font-weight: 600; border-radius: 50%; }
.row-detail td { padding-top: 0; padding-bottom: 0.7rem; }
.row-detail .note { padding: 0 0 0.45rem; }
.row-detail details { font-size: 0.8rem; margin-bottom: 0.4rem; }
.row-detail summary { cursor: pointer; color: var(--accent); font-size: 0.74rem; margin-bottom: 0.3rem; }
.note-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.35rem; }
.note-row .note-lbl { font-size: 0.7rem; color: var(--text-muted); white-space: nowrap; }
@media (max-width: 720px) {
  table.changes, table.changes tbody, table.changes tr, table.changes td { display: block; width: 100%; }
  table.changes thead { display: none; }
  .row-main td { border-top: none; }
  tbody.item { padding: 0.5rem 0; }
}

/* item card */
.item { border: 1px solid var(--border); border-radius: var(--radius); margin: 0.75rem 0; overflow: hidden; background: var(--bg); }
.item.done { border-color: color-mix(in srgb, var(--green) 45%, var(--border)); }
.item.conflict { border-color: color-mix(in srgb, var(--red) 45%, var(--border)); }
.item-head { display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.85rem; border-bottom: 1px solid var(--border); }
.item-head .n { font-size: 0.8rem; color: var(--text-muted); min-width: 2rem; }
.item-head .cat { font-size: 0.72rem; color: var(--text-secondary); }
.item-head .st { margin-left: auto; }
.item-head .why { font-size: 0.72rem; color: var(--text-secondary); }
.badge-why { background: var(--badge-accent-bg, rgba(37,99,235,0.08)); color: var(--accent); display: inline-flex; align-items: center; gap: 0.35rem; padding: 0.18rem 0.55rem; border-radius: 9999px; font-size: 0.7rem; }
html.dark .badge-why { background: rgba(91,154,255,0.12); }
.badge-why .why-ref { font-size: 0.62rem; opacity: 0.7; border-left: 1px solid currentColor; padding-left: 0.35rem; }

.diff { padding: 0.75rem 0.85rem; display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.7rem; align-items: stretch; }
.diff .arrow { color: var(--text-muted); align-self: center; }
.diff .side { padding: 0.55rem 0.7rem; border-radius: 4px; background: var(--surface); border: 1px solid var(--border); font-size: 0.92rem; line-height: 1.55; white-space: pre-wrap; word-break: break-word; }
.diff .side .lbl { display: block; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 0.3rem; }
del { background: var(--badge-red-bg); color: var(--red); text-decoration: line-through; border-radius: 2px; padding: 0 1px; }
ins { background: var(--badge-green-bg); color: var(--green); text-decoration: none; border-radius: 2px; padding: 0 1px; }
.note { padding: 0 0.85rem 0.65rem; font-size: 0.84rem; color: var(--text-secondary); line-height: 1.5; }
.note b, .note strong { color: var(--text); }
.note em { font-style: italic; }

.extra { padding: 0 0.85rem 0.6rem; display: flex; gap: 1rem; flex-wrap: wrap; }
.extra details { font-size: 0.78rem; }
.extra summary { cursor: pointer; color: var(--accent); font-size: 0.74rem; }
.ctx { background: color-mix(in srgb, var(--yellow) 7%, var(--surface)); border: 1px solid var(--badge-yellow-bg); border-radius: 4px; padding: 0.6rem 0.75rem; margin-top: 0.4rem; font-size: 0.86rem; line-height: 1.6; color: var(--text); white-space: pre-wrap; max-height: 260px; overflow: auto; }
.ctx mark { background: var(--yellow); color: #1a1205; font-weight: 600; border-radius: 3px; padding: 0 3px; box-shadow: 0 0 0 1px var(--yellow); }
html.dark .ctx mark { background: var(--yellow); color: #1a1205; }
.raw { font-family: 'JetBrains Mono','Menlo','Consolas',monospace; font-size: 0.72rem; color: var(--text-secondary); background: var(--badge-dim-bg); border-radius: 4px; padding: 0.5rem 0.65rem; margin-top: 0.4rem; white-space: pre-wrap; }
/* Collection-query assembled context */
.qctx { margin-top: 0.4rem; font-size: 0.86rem; line-height: 1.6; color: var(--text); }
.qctx .q-frame { background: color-mix(in srgb, var(--accent) 6%, var(--surface)); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 4px; padding: 0.6rem 0.75rem; }
.qctx .q-occ, .qctx .q-flagged { margin-top: 0.7rem; }
.qctx .q-occ-h { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 0.35rem; }
.qctx .occ { background: color-mix(in srgb, var(--yellow) 7%, var(--surface)); border: 1px solid var(--badge-yellow-bg); border-radius: 4px; padding: 0.45rem 0.6rem; margin-bottom: 0.35rem; display: flex; gap: 0.6rem; }
.qctx .occ-lbl { flex-shrink: 0; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); min-width: 4.2rem; padding-top: 0.1rem; }
.qctx .occ-txt { flex: 1; }
.qctx mark { background: var(--yellow); color: #1a1205; font-weight: 600; border-radius: 3px; padding: 0 3px; box-shadow: 0 0 0 1px var(--yellow); }
.qctx .q-flagged ul { margin: 0; padding-left: 0; list-style: none; }
.qctx .q-flagged li { margin-bottom: 0.3rem; padding-left: 0; }
.qctx .q-flagged .occ-lbl { display: inline-block; min-width: 4.2rem; }

.reviewers { padding: 0.65rem 0.85rem 0.8rem; display: flex; flex-direction: column; gap: 0.5rem; border-top: 1px dashed var(--border); }
.rev { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.rev .role { font-size: 0.8rem; color: var(--text-secondary); min-width: 5.5rem; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 5px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 0.3rem 0.8rem; font-size: 0.8rem; background: var(--surface); color: var(--text-secondary); cursor: pointer; font-family: inherit; transition: all 0.12s; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button:hover { background: var(--progress-bg); }
.seg button.sel-yes { background: var(--green); color: #fff; }
.seg button.sel-no { background: var(--red); color: #fff; }
.seg button.sel-other { background: var(--accent); color: #fff; }
.rnote { flex: 1; min-width: 150px; border: 1px solid var(--border); border-radius: 4px; padding: 0.3rem 0.55rem; font: inherit; font-size: 0.8rem; background: var(--bg); color: var(--text); }
.rnote:focus { outline: none; border-color: var(--accent); }

/* footer */
footer.bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 200; background: var(--theme-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--border); padding: 0.6rem 2rem; display: flex; gap: 0.6rem; align-items: center; }
footer.bar .who { font-size: 0.82rem; color: var(--text-secondary); }
footer.bar .spacer { flex: 1; }

.toast { position: fixed; bottom: 4.5rem; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 0.5rem 0.9rem; border-radius: 6px; font-size: 0.82rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 400; }
.toast.show { opacity: 0.95; }

.colophon { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.74rem; color: var(--text-muted); line-height: 1.5; }

@media (max-width: 720px) { .diff { grid-template-columns: 1fr; } .diff .arrow { transform: rotate(90deg); justify-self: center; } }
</style>
</head>
<body>

<div class="grid-lines"><div class="grid-lines-inner">
  <div class="grid-line"></div><div class="grid-line"></div>
</div></div>

<div class="theme-bar" id="theme-bar">
  <div class="font-name" id="font-name" title="Click to change typeface">IBM Plex Serif</div>
  <div class="font-options" id="font-options">
    <button class="theme-opt" data-font="literata">Literata</button>
    <button class="theme-opt" data-font="ibm-serif">IBM Plex Serif</button>
    <button class="theme-opt" data-font="menlo">Menlo</button>
    <button class="theme-opt" data-font="ibm-sans">IBM Plex Sans</button>
  </div>
  <div class="theme-sep"></div>
  <button class="dark-btn" id="dark-btn" title="Toggle dark mode">&#9790;</button>
</div>

<div class="content">
  <nav class="chapnav" id="chapNav"></nav>
  <div class="header">
    <div>
      <div class="crumb" id="docCrumb"></div>
      <h1 id="docTitle"></h1>
      <div class="sub" id="docSub"></div>
    </div>
    <div class="prevnext" id="prevNext"></div>
  </div>

  <div class="role-banner">
    <span class="role-banner-lbl">I am reviewing as</span>
    <select class="sel sel-role" id="whoami"></select>
    <span class="role-banner-hint" id="roleHint"></span>
  </div>

  <div class="toolbar">
    <div class="progress-wide"><i id="progBar"></i></div>
    <span class="prog-label" id="progPct"></span>
    <span class="spacer"></span>
    <label class="prog-label">Show
      <select class="sel" id="filter">
        <option value="all">all</option>
        <option value="undecided">undecided</option>
        <option value="conflict">conflicts</option>
        <option value="done">complete</option>
      </select>

<script>
/* ── Font + theme system (mirrors prodcal app.js) ── */
var _fonts = {
  'ibm-serif': { family: "'IBM Plex Serif',Georgia,serif", label: 'IBM Plex Serif' },
  'ibm-sans':  { family: "'IBM Plex Sans',-apple-system,sans-serif", label: 'IBM Plex Sans' },
  literata:    { family: "'Literata',Georgia,serif", label: 'Literata' },
  menlo:       { family: "'Menlo','Consolas','Monaco',monospace", label: 'Menlo' },
};
var _fontKeys = ['literata','ibm-serif','menlo','ibm-sans'];
// Font is frozen on a reviewer's very first load (random pick) and persisted,
// so it stays consistent across the index + every chapter. A reviewer can pick
// an alternate face at any time; that choice then persists until changed again.
var _themeState = { font: null, dark: false };
try { var _s = JSON.parse(localStorage.getItem('prodcal-theme-v1')); if (_s){ _themeState.dark = !!_s.dark; if (_s.font) _themeState.font = _s.font; } } catch(e) {}
var _fontWasFrozen = !!_themeState.font;
if (!_themeState.font) { _themeState.font = _fontKeys[Math.floor(Math.random()*_fontKeys.length)]; }
function _applyTheme() {
  var f = _fonts[_themeState.font];
  if (f) { document.body.style.fontFamily = f.family; var n = document.getElementById('font-name'); if (n) n.textContent = f.label; }
  document.documentElement.classList.toggle('dark', _themeState.dark);
  document.querySelectorAll('.theme-opt[data-font]').forEach(function(b){ b.classList.toggle('active', b.dataset.font===_themeState.font); });
  var db = document.getElementById('dark-btn'); if (db) db.textContent = _themeState.dark ? '\u2600' : '\u263e';
}
function _saveTheme(){ try { localStorage.setItem('prodcal-theme-v1', JSON.stringify({dark:_themeState.dark, font:_themeState.font})); } catch(e){} }
// Freeze the initial (possibly random) pick immediately so it carries across pages.
if (!_fontWasFrozen) { _saveTheme(); }
(function _initThemeBar(){
  var bar = document.getElementById('theme-bar'); var expanded = false;
  var nameEl = document.getElementById('font-name');
  nameEl.addEventListener('click', function(){ expanded=!expanded; bar.classList.toggle('expanded',expanded); });
  document.addEventListener('click', function(e){ if(expanded && !bar.contains(e.target)){ expanded=false; bar.classList.remove('expanded'); } });
  bar.querySelectorAll('.theme-opt[data-font]').forEach(function(b){ b.addEventListener('click', function(){ _themeState.font=this.dataset.font; _applyTheme(); _saveTheme(); expanded=false; bar.classList.remove('expanded'); }); });
  document.getElementById('dark-btn').addEventListener('click', function(){ _themeState.dark=!_themeState.dark; _applyTheme(); _saveTheme(); });
  _applyTheme();
})();

/* ── Review app ── */
(function(){
  const DATA = JSON.parse(document.getElementById('review-data').textContent);
  const ROLES = DATA.roles;
  const KEY = 'review:' + DATA.id;
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ state = {}; }
  let activeRole = localStorage.getItem(KEY+':whoami') || ROLES[0];

  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs){
      if (k==='class') n.className = attrs[k];
      else if (k==='html') n.innerHTML = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    for (const kid of kids){ if (kid==null) continue; n.append(kid.nodeType?kid:document.createTextNode(kid)); }
    return n;
  };
  function rec(id){ return state[id] || (state[id] = {}); }
  function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }
  function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1400); }

  function itemStatus(id){
    const r = state[id] || {};
    const ds = ROLES.map(role => (r[role]||{}).decision).filter(Boolean);
    if (ds.length===0) return 'open';
    const hasYes = ds.some(d=>d==='yes'||d==='accept'||d==='keep');
    const hasNo = ds.some(d=>d==='no'||d==='change'||d==='unify');
    if (hasYes && hasNo) return 'conflict';
    if (ds.length===ROLES.length) return 'done';
    return 'partial';
  }

  const allItems = [];
  DATA.sections.forEach(s => s.items.forEach(it => allItems.push(it)));
  DATA.queries.forEach(q => allItems.push(q));

  function updateProgress(){
    const total = allItems.length; let done=0, conflict=0;
    allItems.forEach(it => { const st=itemStatus(it.id); if(st==='done')done++; if(st==='conflict')conflict++; });
    const pct = total ? Math.round(done/total*100) : 0;
    document.getElementById('progBar').style.width = pct+'%';
    document.getElementById('progPct').textContent = done+'/'+total+' complete'+(conflict?('  \u00b7  '+conflict+' conflict'):'');
  }

  const IS_COLLECTION = !!DATA.collection;
  const labelMap = {yes:'Approved',no:'Rejected',accept:'Accepted',change:'Change',discuss:'Discuss',keep:'Keep as-is',unify:'Unify'};
  const optsFor = isQuery => !isQuery
    ? [['yes','Approve','yes'],['no','Reject','no']]
    : IS_COLLECTION
      ? [['keep','Keep as-is','yes'],['unify','Unify','no'],['discuss','Discuss','other']]
      : [['accept','Accept','yes'],['change','Change','no'],['discuss','Discuss','other']];

  // Each change is a <tbody> (a main row + a detail row) inside the section table.
  function buildRow(it, isQuery){
    const tb = el('tbody',{class:'item','data-id':it.id});

    // --- main row ---
    const main = el('tr',{class:'row-main'});
    main.append(el('td',{class:'c-n'}, isQuery ? it.tag : ('#'+it.n)));

    const whyTd = el('td',{class:'c-why'});
    if (isQuery) whyTd.append(el('span',{class:'badge badge-accent'},'query'));
    else if (it.explainer){
      const why = el('span',{class:'badge badge-why', title:'Stylesheet '+(it.explainer_ref||'')}, it.explainer);
      if (it.explainer_ref) why.append(el('span',{class:'why-ref'}, it.explainer_ref));
      whyTd.append(why);
    }
    if (it.instances && it.instances>1) whyTd.append(el('span',{class:'badge badge-yellow',style:'margin-left:.3rem'}, '\u00d7'+it.instances));
    main.append(whyTd);

    const chTd = el('td',{class:'c-change'});
    if (it.before_html || it.after_html){
      const b=el('span',{class:'d-old'}); b.innerHTML=it.before_html||'';
      const a=el('span',{class:'d-new'}); a.innerHTML=it.after_html||'';
      chTd.append(b, el('span',{class:'d-arr'},'\u2192'), a);
    } else if (it.note){
      chTd.append(el('span',{class:'q-text', html:it.note}));
    }
    main.append(chTd);

    const youTd = el('td',{class:'c-you'});
    const seg = el('div',{class:'seg'});
    const r = rec(it.id);
    optsFor(isQuery).forEach(([val,label,kind])=>{
      const b = el('button',{}, label);
      if ((r[activeRole]||{}).decision===val) b.classList.add('sel-'+(kind==='yes'?'yes':kind==='no'?'no':'other'));
      b.addEventListener('click', (e)=>{
        e.stopPropagation();
        const rr=rec(it.id); rr[activeRole]=rr[activeRole]||{};
        rr[activeRole].decision = (rr[activeRole].decision===val)?null:val;
        save(); refreshRow(tb,it,isQuery); updateProgress(); applyFilter();
      });
      seg.append(b);
    });
    youTd.append(seg);
    main.append(youTd);

    const stTd = el('td',{class:'c-st'});
    main.append(stTd);
    tb.append(main);

    // --- detail row (context open by default, changelog collapsed, note) ---
    const detail = el('tr',{class:'row-detail'});
    const dcell = el('td',{class:'detail-cell',colspan:'5'});
    if (it.note && (it.before_html||it.after_html)) dcell.append(el('div',{class:'note', html:it.note}));
    if (it.context){
      const cd = el('details',{open:''});
      cd.append(el('summary',{},'Manuscript context'));
      const c=el('div',{class:'ctx'}); c.innerHTML=it.context; cd.append(c);
      dcell.append(cd);
    }
    // Rich, assembled context for collection-wide queries (open by default).
    if (it.context_html){
      const cd = el('details',{open:''});
      cd.append(el('summary',{},'Context for this ruling'));
      const c=el('div',{class:'qctx'}); c.innerHTML=it.context_html; cd.append(c);
      dcell.append(cd);
    }
    // Only show the raw changelog line when it adds info beyond the question.
    if (it.raw && !it.context_html){
      const rd=el('details'); rd.append(el('summary',{},'Changelog entry'));
      rd.append(el('div',{class:'raw'}, it.raw)); dcell.append(rd);
    }
    const noteRow = el('div',{class:'note-row'});
    noteRow.append(el('span',{class:'note-lbl'}, 'Your note'));
    const note = el('input',{class:'rnote',type:'text',placeholder:'optional \u2014 visible to others on submit'});
    note.value = ((r[activeRole]||{}).note)||'';
    note.addEventListener('input', ()=>{ const rr=rec(it.id); rr[activeRole]=rr[activeRole]||{}; rr[activeRole].note=note.value; save(); });
    noteRow.append(note);
    dcell.append(noteRow);
    detail.append(dcell);
    tb.append(detail);

    paintStatus(tb, it, stTd);
    return tb;
  }

  function paintStatus(tb, it, stTd){
    const st = itemStatus(it.id);
    tb.classList.toggle('done', st==='done');
    tb.classList.toggle('conflict', st==='conflict');
    tb.dataset.status = st;
    stTd = stTd || tb.querySelector('.c-st');
    stTd.innerHTML='';
    const wrap = el('div',{class:'st-wrap'});
    if (st==='done') wrap.append(el('span',{class:'badge badge-green'},'\u2713'));
    else if (st==='conflict') wrap.append(el('span',{class:'badge badge-red'},'conflict'));
    else if (st==='partial') wrap.append(el('span',{class:'badge badge-dim'},'partial'));
    else wrap.append(el('span',{class:'badge badge-dim'},'open'));
    // other roles' calls as compact chips
    const r = state[it.id]||{};
    ROLES.filter(role=>role!==activeRole).forEach(role=>{
      const d=r[role]||{}; if(!d.decision) return;
      const cls = (d.decision==='yes'||d.decision==='accept'||d.decision==='keep')?'badge-green':(d.decision==='no'||d.decision==='change'||d.decision==='unify')?'badge-red':'badge-accent';
      wrap.append(el('span',{class:'badge chip-other '+cls, title:role+': '+(labelMap[d.decision]||d.decision)+(d.note?(' \u2014 '+d.note):'')}, role[0]));
    });
    stTd.append(wrap);
  }
  function refreshRow(oldTb, it, isQuery){ oldTb.replaceWith(buildRow(it,isQuery)); }

  function groupSet(items, role, val){
    items.forEach(it => { const rr=rec(it.id); rr[role]=rr[role]||{}; rr[role].decision=val; });
    save(); render(); toast(role+': set '+items.length+' items');
  }

  const main = document.getElementById('main');
  function render(){
    main.innerHTML='';
    DATA.sections.forEach(sec => main.append(buildSection(sec,false)));
    if (DATA.queries.length) main.append(buildSection({id:'queries',title:'Author queries',items:DATA.queries,query:true}, true));
    updateProgress(); applyFilter();
  }

  function buildSection(sec, isQuery){
    const det = el('details',{class:'section'});
    det.dataset.section = sec.id;
    // Open small sections (<5 items) on load so short query lists are visible.
    if ((sec.items||[]).length < 5) det.open = true;
    const sum = el('summary',{},
      el('span',{class:'sec-caret'},'\u25B6'),
      el('span',{class:'sec-title'}, sec.title),
      el('span',{class:'sec-count'}, '('+sec.items.length+')'));
    if (sec.series) sum.append(el('span',{class:'badge badge-yellow'},'series-wide'));
    if (isQuery) sum.append(el('span',{class:'badge badge-accent'},'decisions'));
    det.append(sum);

    const ga = el('div',{class:'group-actions'});
    ga.append(el('span',{class:'lbl'},'Bulk (as '+activeRole+')'));
    const yes = el('button',{class:'btn-sm'}, isQuery?'accept all':'approve all');
    yes.addEventListener('click', ()=>groupSet(sec.items, activeRole, isQuery?'accept':'yes'));
    const no = el('button',{class:'btn-sm'}, isQuery?'flag all':'reject all');
    no.addEventListener('click', ()=>groupSet(sec.items, activeRole, isQuery?'change':'no'));
    ga.append(yes, no);
    const clr = el('button',{class:'btn-sm btn-secondary',style:'margin-left:auto'}, 'clear my calls');
    clr.addEventListener('click', ()=>{ sec.items.forEach(it=>{ if(state[it.id]) delete state[it.id][activeRole]; }); save(); render(); });
    ga.append(clr);
    det.append(ga);

    const table = el('table',{class:'changes'+(isQuery?' is-query':'')});
    const thead = el('thead',{}, el('tr',{},
      el('th',{class:'c-n'},'#'),
      el('th',{class:'c-why'},'Why'),
      el('th',{class:'c-change'}, isQuery?'Query':'Change'),
      el('th',{class:'c-you'},'You'),
      el('th',{class:'c-st'},'Status')));
    table.append(thead);
    sec.items.forEach(it => table.append(buildRow(it, isQuery)));
    det.append(table);
    return det;
  }

  function applyFilter(){
    const f = document.getElementById('filter').value;
    document.querySelectorAll('tbody.item').forEach(tb=>{
      const st = tb.dataset.status; let show=true;
      if (f==='undecided') show=(st==='open'||st==='partial');
      else if (f==='conflict') show=(st==='conflict');
      else if (f==='done') show=(st==='done');
      tb.style.display = show?'':'none';
    });
    document.querySelectorAll('details.section').forEach(sec=>{
      const vis = [...sec.querySelectorAll('tbody.item')].some(c=>c.style.display!=='none');
      sec.style.display = (f==='all'||vis)?'':'none';
    });
  }

  function decisionLabel(it, role){
    const d = (state[it.id]||{})[role]||{};
    if (!d.decision) return '\u2014';
    const map = {yes:'APPROVE',no:'REJECT',accept:'ACCEPT',change:'CHANGE',discuss:'DISCUSS'};
    return (map[d.decision]||d.decision) + (d.note?(' ('+d.note+')'):'');
  }
  function summaryText(forRole){
    const L=[]; L.push(DATA.title); L.push('Review summary \u2014 '+new Date().toLocaleString());
    L.push(forRole ? ('Reviewer: '+forRole) : ('Roles: '+ROLES.join(', '))); L.push('');
    const sections = DATA.sections.concat([{title:'Author queries',items:DATA.queries}]);
    sections.forEach(sec=>{ if(!sec.items.length) return; L.push('## '+sec.title);
      sec.items.forEach(it=>{ const head=it.tag?it.tag:('#'+it.n);
        L.push('  '+head+'  '+(it.before_txt||'')+(it.after_txt?('  ->  '+it.after_txt):'')+(it.before_txt||it.after_txt?'':(' '+stripTags(it.note||''))));
        const roles = forRole ? [forRole] : ROLES;
        roles.forEach(role=> L.push('      - '+role+': '+decisionLabel(it,role)));
      }); L.push('');
    });
    return L.join('\n');
  }
  function stripTags(h){ const d=document.createElement('div'); d.innerHTML=h; return d.textContent||''; }
  function exportSummary(){ download(DATA.id+'-summary.txt', summaryText(null), 'text/plain'); }

  function submitReview(){
    const email = (prompt('Your email (used as Reply-To so the editor can reply to you):', localStorage.getItem('review:replyTo')||'')||'').trim();
    if (!email) return;
    localStorage.setItem('review:replyTo', email);
    const name = (prompt('Your name (optional):', localStorage.getItem('review:name')||'')||'').trim();
    localStorage.setItem('review:name', name);
    const btn = document.getElementById('btnSubmit'); btn.disabled=true; const old=btn.textContent; btn.textContent='Sending\u2026';
    fetch('/api/submit', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ docId:DATA.id, title:DATA.title, reviewer:activeRole,
        replyTo:email, name:name, summary:summaryText(activeRole), decisions:state }) })
      .then(r=>r.json().then(j=>({ok:r.ok,j})))
      .then(({ok,j})=>{ if(ok&&j.ok){ toast('Submitted to '+(j.to||'editor')); } else { alert('Submit failed: '+(j.error||'unknown')); } })
      .catch(e=>alert('Submit failed (is the server running, not busybox?): '+e))
      .finally(()=>{ btn.disabled=false; btn.textContent=old; });
  }
  function download(name, content, type){
    const blob = new Blob([content],{type});
    const a = el('a',{href:URL.createObjectURL(blob), download:name});
    document.body.append(a); a.click(); a.remove(); toast('Downloaded '+name);
  }

  // Chapter eyebrow nav + prev/next
  (function buildChapNav(){
    const nav = document.getElementById('chapNav');
    const chs = DATA.chapters || [];
    if (!chs.length) return;
    nav.append(el('span',{class:'crumb',style:'margin-right:0.5rem'}, (DATA.book||'')+' \u00b7 chapters'));
    let curIdx = -1;
    chs.forEach((c,i)=>{
      if (c.n===DATA.chapterNum) curIdx=i;
      const a = el('a',{href:c.url, class:(c.n===DATA.chapterNum?'cur':'')},
        el('span',{class:'cn'}, c.num), c.label);
      nav.append(a);
    });
    const pn = document.getElementById('prevNext');
    const prev = chs[curIdx-1], next = chs[curIdx+1];
    pn.append(el('a',{href: prev?prev.url:'#', class: prev?'':'disabled'}, '\u2190 Prev'));
    pn.append(el('a',{href: next?next.url:'#', class: next?'':'disabled'}, 'Next \u2192'));
  })();

  document.getElementById('docCrumb').textContent = DATA.crumb || 'Copyedit review';
  document.getElementById('docTitle').textContent = DATA.title;
  document.getElementById('docSub').textContent = DATA.subtitle || '';
  document.getElementById('colophon').innerHTML = DATA.colophon || '';
  const who = document.getElementById('whoami');
  ROLES.forEach(r=> who.append(el('option',{value:r}, r)));
  if (ROLES.indexOf(activeRole)<0) activeRole = ROLES[0];
  who.value = activeRole;
  function setRoleUI(){
    document.getElementById('footWho').textContent = activeRole;
    document.getElementById('roleHint').textContent = 'Showing your Approve / Reject controls. Other reviewers\u2019 calls appear as read-only chips.';
  }
  who.addEventListener('change', ()=>{ activeRole=who.value; localStorage.setItem(KEY+':whoami',activeRole); setRoleUI(); render(); });
  setRoleUI();
  document.getElementById('filter').addEventListener('change', applyFilter);
  document.getElementById('expandAll').addEventListener('click', ()=>document.querySelectorAll('details.section').forEach(d=>d.open=true));
  document.getElementById('collapseAll').addEventListener('click', ()=>document.querySelectorAll('details.section').forEach(d=>d.open=false));
  document.getElementById('btnSummary').addEventListener('click', exportSummary);
  document.getElementById('btnReset').addEventListener('click', ()=>{ if(confirm('Clear all decisions for this story on this device?')){ state={}; save(); render(); toast('Reset'); } });
  document.getElementById('btnSubmit').addEventListener('click', submitReview);

  render();
})();
</script>
</body>
